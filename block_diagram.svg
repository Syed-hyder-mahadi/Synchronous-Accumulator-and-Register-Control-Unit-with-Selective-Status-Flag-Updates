<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1080" height="620" fill="#ffffff"/>

  <!-- ================= Combinational ALU group ================= -->
  <rect x="200" y="55" width="400" height="285" rx="8" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="212" y="76" font-size="13" font-weight="bold" fill="#444">Combinational ALU  (always @(*))</text>

  <rect x="230" y="95" width="170" height="60" rx="5" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="315" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Adder (9-bit)</text>
  <text x="315" y="140" font-size="11" text-anchor="middle" fill="#333">acc + data_in</text>

  <rect x="230" y="175" width="170" height="60" rx="5" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="315" y="200" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Subtractor</text>
  <text x="315" y="220" font-size="11" text-anchor="middle" fill="#333">acc - data_in</text>

  <rect x="450" y="95" width="120" height="160" rx="5" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="510" y="125" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Result Select</text>
  <text x="510" y="142" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Mux</text>
  <text x="510" y="167" font-size="11" text-anchor="middle" fill="#333">HOLD: acc</text>
  <text x="510" y="184" font-size="11" text-anchor="middle" fill="#333">LOAD: data_in</text>
  <text x="510" y="201" font-size="11" text-anchor="middle" fill="#333">ADD: sum</text>
  <text x="510" y="218" font-size="11" text-anchor="middle" fill="#333">SUB: difference</text>

  <line x1="400" y1="125" x2="450" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="205" x2="450" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="215" y="274" font-size="11" fill="#555">carry_next and overflow_next are produced</text>
  <text x="215" y="290" font-size="11" fill="#555">by the adder / subtractor (0 for HOLD, LOAD)</text>
  <text x="595" y="274" font-size="11" text-anchor="end" fill="#333">carry_next</text>
  <text x="595" y="304" font-size="11" text-anchor="end" fill="#333">overflow_next</text>

  <!-- ================= Inputs ================= -->
  <text x="15" y="134" font-size="13" font-weight="bold" fill="#222">data_in[7:0]</text>
  <line x1="105" y1="130" x2="200" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="15" y="419" font-size="13" font-weight="bold" fill="#222">op[1:0]</text>
  <line x1="105" y1="415" x2="200" y2="415" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="15" y="494" font-size="13" font-weight="bold" fill="#222">flag_en</text>
  <line x1="105" y1="490" x2="780" y2="490" stroke="#333" stroke-width="1.5"/>
  <line x1="780" y1="490" x2="780" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="483" font-size="11" fill="#555">flag update enable  (flag_en and op != HOLD)</text>

  <text x="15" y="524" font-size="13" font-weight="bold" fill="#222">rst</text>
  <line x1="105" y1="520" x2="880" y2="520" stroke="#333" stroke-width="1.5"/>
  <text x="15" y="564" font-size="13" font-weight="bold" fill="#222">clk</text>
  <line x1="105" y1="560" x2="880" y2="560" stroke="#333" stroke-width="1.5"/>
  <line x1="880" y1="560" x2="880" y2="180" stroke="#333" stroke-width="1.5"/>
  <circle cx="880" cy="520" r="3" fill="#333"/>
  <line x1="880" y1="180" x2="860" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="880" cy="430" r="3" fill="#333"/>
  <line x1="880" y1="430" x2="860" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="890" y="545" font-size="11" fill="#555">clk, rst</text>

  <!-- ================= Operation decoder ================= -->
  <rect x="200" y="380" width="220" height="70" rx="5" fill="#fff4e0" stroke="#d08a00" stroke-width="1.5"/>
  <text x="310" y="402" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Operation Decoder</text>
  <text x="310" y="420" font-size="11" text-anchor="middle" fill="#333">00 HOLD    01 LOAD</text>
  <text x="310" y="436" font-size="11" text-anchor="middle" fill="#333">10 ADD      11 SUB</text>
  <line x1="310" y1="380" x2="310" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="318" y="365" font-size="11" fill="#555">operation select</text>

  <!-- write enable path to accumulator -->
  <line x1="420" y1="415" x2="620" y2="415" stroke="#333" stroke-width="1.5"/>
  <line x1="620" y1="415" x2="620" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="620" y1="170" x2="700" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="408" font-size="11" fill="#555">write_en  (op != HOLD)</text>

  <!-- ================= Accumulator register ================= -->
  <rect x="700" y="90" width="160" height="100" rx="5" fill="#e6f4ea" stroke="#2f8f4e" stroke-width="1.5"/>
  <text x="780" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Accumulator Register</text>
  <text x="780" y="140" font-size="11" text-anchor="middle" fill="#333">acc[7:0]</text>
  <text x="780" y="157" font-size="11" text-anchor="middle" fill="#333">8 flip-flops, sync reset</text>

  <line x1="570" y1="135" x2="700" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="605" y="128" font-size="11" fill="#333">result[7:0]</text>

  <!-- acc output and feedback -->
  <line x1="860" y1="110" x2="975" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="982" y="114" font-size="13" font-weight="bold" fill="#222">acc[7:0]</text>
  <circle cx="870" cy="110" r="3" fill="#333"/>
  <line x1="870" y1="110" x2="870" y2="30" stroke="#333" stroke-width="1.5"/>
  <line x1="870" y1="30" x2="300" y2="30" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="30" x2="300" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="22" font-size="11" fill="#555">acc[7:0] feedback to adder, subtractor and mux</text>

  <!-- ================= Flag logic ================= -->
  <rect x="640" y="240" width="190" height="90" rx="5" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.5"/>
  <text x="735" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Flag Logic</text>
  <text x="735" y="282" font-size="11" text-anchor="middle" fill="#333">Z = (result == 0)</text>
  <text x="735" y="298" font-size="11" text-anchor="middle" fill="#333">N = result[7]</text>
  <text x="735" y="314" font-size="11" text-anchor="middle" fill="#333">C, V from carry / overflow</text>

  <line x1="600" y1="270" x2="640" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="300" x2="640" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="665" cy="135" r="3" fill="#333"/>
  <line x1="665" y1="135" x2="665" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================= Flag register ================= -->
  <rect x="700" y="370" width="160" height="80" rx="5" fill="#e6f4ea" stroke="#2f8f4e" stroke-width="1.5"/>
  <text x="780" y="398" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Flag Register</text>
  <text x="780" y="418" font-size="11" text-anchor="middle" fill="#333">Z  N  C  V</text>
  <text x="780" y="435" font-size="11" text-anchor="middle" fill="#333">4 flip-flops, sync reset</text>

  <line x1="735" y1="330" x2="735" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="742" y="354" font-size="11" fill="#555">next flags</text>

  <line x1="860" y1="400" x2="975" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="982" y="404" font-size="13" font-weight="bold" fill="#222">Z, N, C, V</text>

  <!-- ================= Caption ================= -->
  <text x="540" y="600" font-size="13" text-anchor="middle" fill="#333">Figure 1: Block diagram of accumulator_control (8-bit accumulator and register control unit)</text>
</svg>
